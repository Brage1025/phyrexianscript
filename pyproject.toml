[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phyx"
version = "1.6.4"
description = "φyrx (PhyrxScript / PhyrexianScript) — a programming language written in Phyrexian"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brage" }]
keywords = [
    "esolang", "phyrexian", "mtg", "interpreter", "conlang", "language",
    "phyx", "phyrx", "phyrxscript", "phyrexianscript",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Interpreters",
]

[project.urls]
Homepage = "https://github.com/Brage1025/phyrexianscript"
Documentation = "https://github.com/Brage1025/phyrexianscript/tree/main/docs"
Issues = "https://github.com/Brage1025/phyrexianscript/issues"

[project.scripts]
phyx = "phyx.cli:main"
phyrx = "phyx.cli:main"
phyrxscript = "phyx.cli:main"
phyrexianscript = "phyx.cli:main"

[project.optional-dependencies]
dev = ["ruff~=0.17", "coverage", "build", "twine"]

[tool.setuptools]
packages = ["phyx"]
# phyx/lib is herd data, not an importable package. Leaving include-package-data
# on makes setuptools warn that phyx.lib is absent from `packages`.
include-package-data = false

[tool.setuptools.package-data]
phyx = ["lib/*.phyx"]

[tool.ruff]
line-length = 127
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
