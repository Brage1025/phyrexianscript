name: Publish extension

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Where to publish the VSIX
        type: choice
        options:
          - both
          - marketplace
          - openvsx
        default: both
  release:
    types: [published]

jobs:
  marketplace:
    if: ${{ github.event_name == 'release' || inputs.registry == 'marketplace' || inputs.registry == 'both' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: editors
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Package
        run: npx --yes @vscode/vsce package --no-dependencies
      - name: Publish to Visual Studio Marketplace
        run: npx --yes @vscode/vsce publish --oidc --no-dependencies

  openvsx:
    if: ${{ github.event_name == 'release' || inputs.registry == 'openvsx' || inputs.registry == 'both' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: editors
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Package
        run: npx --yes @vscode/vsce package --no-dependencies
      - name: Publish to Open VSX
        run: npx --yes ovsx publish --trusted-publishing --no-dependencies
