name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
            coverage: true
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Python tests
        if: ${{ matrix.coverage != true }}
        run: python -m unittest discover -s tests -v
      - name: Python tests under coverage
        if: ${{ matrix.coverage == true }}
        run: python -m coverage run -m unittest discover -s tests -v
      - name: φyrx tests
        if: ${{ matrix.coverage != true }}
        run: python -m phyx test
      - name: φyrx tests under coverage
        if: ${{ matrix.coverage == true }}
        run: python -m coverage run -a -m phyx test
      - name: Coverage report
        if: ${{ matrix.coverage == true }}
        run: |
          python -m coverage report | tee coverage-report.txt
          {
            echo '### Coverage'
            echo '```'
            cat coverage-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  tree-walker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      PHYX_TREEWALK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: φyrx tests
        run: python -m phyx test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Fuzz
        run: PHYX_FUZZ=3000 python -m unittest tests.test_parity_fuzz -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Twine check
        run: python -m twine check dist/*
      - name: Install the wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv "$RUNNER_TEMP/phyx-wheel"
          "$RUNNER_TEMP/phyx-wheel/bin/python" -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          "$RUNNER_TEMP/phyx-wheel/bin/phyx" --version
          "$RUNNER_TEMP/phyx-wheel/bin/phyx" lib
          "$RUNNER_TEMP/phyx-wheel/bin/phyx" -c '!1.'
      - name: Install the sdist outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv "$RUNNER_TEMP/phyx-sdist"
          "$RUNNER_TEMP/phyx-sdist/bin/python" -m pip install "$GITHUB_WORKSPACE"/dist/*.tar.gz
          "$RUNNER_TEMP/phyx-sdist/bin/phyx" --version
          "$RUNNER_TEMP/phyx-sdist/bin/phyx" lib

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extension manifest
        run: python -c "import json, pathlib; p=json.loads(pathlib.Path('editors/package.json').read_text(encoding='utf-8')); assert p['contributes']['grammars'][0]['scopeName']=='source.phyx'"
      - name: Extension check
        run: node editors/check.js

  ci-passed:
    name: ci-passed
    needs: [test, tree-walker, lint, fuzz, package, extension]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every needed job succeeded
        env:
          TEST: ${{ needs.test.result }}
          TREE_WALKER: ${{ needs.tree-walker.result }}
          LINT: ${{ needs.lint.result }}
          FUZZ: ${{ needs.fuzz.result }}
          PACKAGE: ${{ needs.package.result }}
          EXTENSION: ${{ needs.extension.result }}
        run: |
          fail=0
          check() {
            if [ "$2" != "success" ]; then
              echo "$1 finished as $2"
              fail=1
            else
              echo "$1 finished as success"
            fi
          }
          check test "$TEST"
          check tree-walker "$TREE_WALKER"
          check lint "$LINT"
          check fuzz "$FUZZ"
          check package "$PACKAGE"
          check extension "$EXTENSION"
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
