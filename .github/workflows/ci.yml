name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: φyrx tests
        run: python -m phyx test
      - name: Package
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extension manifest
        run: python -c "import json, pathlib; p=json.loads(pathlib.Path('editors/package.json').read_text(encoding='utf-8')); assert p['contributes']['grammars'][0]['scopeName']=='source.phyx'"
