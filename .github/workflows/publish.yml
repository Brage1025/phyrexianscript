name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  pypi:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
